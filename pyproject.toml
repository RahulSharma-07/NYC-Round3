[project]
name = "pc-use"
version = "0.2.0"
description = "AI-powered voice/text computer controller using Gemini and PyAutoGUI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Team Code Matrix" },
]
keywords = ["voice-control", "automation", "ai", "gemini", "pyautogui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Scientific Computing :: Artificial Intelligence",
]

dependencies = [
    "google-genai>=1.0.0",
    "numpy>=2.3.0",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "SpeechRecognition>=3.10.0",
    "opencv-python>=4.8.0",
]

[project.scripts]
pc-use = "pc_use.cli:main"

[project.optional-dependencies]
voice = ["pyaudio>=0.2.14"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pyaudio>=0.2.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "UP"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["pc_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

